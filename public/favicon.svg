<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#D50000" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="#1A1C28" stroke="#2D3142" stroke-width="2"/>
  <!-- Tomato Body -->
  <circle cx="50" cy="55" r="32" fill="url(#tomatoGrad)" filter="url(#glow)" />
  <!-- Stem / Leaf -->
  <path d="M50 25 C48 18, 52 14, 55 12 C53 18, 50 22, 50 25 Z" fill="url(#leafGrad)"/>
  <path d="M50 26 Q40 22 32 26 Q42 29 50 26 Z" fill="url(#leafGrad)"/>
  <path d="M50 26 Q60 22 68 26 Q58 29 50 26 Z" fill="url(#leafGrad)"/>
  <!-- Mic overlay icon inside tomato -->
  <rect x="45" y="44" width="10" height="15" rx="5" fill="#FFFFFF" opacity="0.95"/>
  <path d="M40 52 C40 58, 60 58, 60 52" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
  <line x1="50" y1="58" x2="50" y2="64" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
</svg>
